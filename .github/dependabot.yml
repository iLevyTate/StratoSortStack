version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Canvas 1.0.12/1.0.13 SIGSEGV under Electron 41 on Linux; see #29.
      # Keep 1.0.11 until a newer release passes the native verification gate.
      - dependency-name: '@napi-rs/canvas'
        versions: ['1.0.12', '1.0.13']

      # @types/node must track the runtime major (Node 24, see .nvmrc and
      # package.json#engines; .nvmrc pins the Node inside Electron 45.2).
      # Allow minor/patch bumps within 24.x; refuse cross-major jumps (e.g.
      # 25.x) which would expose Node-25-only APIs to TypeScript even though
      # the runtime is still 24.x. Re-evaluate this
      # ignore rule whenever .nvmrc moves to a new major.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

      # ─── electron: majors by hand ────────────────────────────────────────
      # CANONICAL RATIONALE for the electron version policy. CLAUDE.md and
      # package.json#electron reference this comment rather than duplicating
      # it — keep this entry the single source of truth.
      #
      # STATUS (2026-10-29): on electron ^45.1.0, the latest stable major.
      # Upstream supports the latest three stable majors, so stay within
      # three of latest; minor/patch bumps (security fixes) still arrive
      # through the minor-and-patch group above.
      #
      # Why majors are manual: each one can break native modules and
      # sandboxed-preload or clipboard APIs, and needs a read of
      # https://github.com/electron/electron/blob/main/docs/breaking-changes.md
      # plus the recipe below. Earlier unattended major bumps (41 -> 42) had
      # to be reverted.
      #
      # What the 41 -> 45 bump needed:
      #   - node-abi under @electron/rebuild refreshed in the lockfile
      #     (4.26.0 could not resolve electron 42+; 4.40.0 covers through 45).
      #   - better-sqlite3 12 -> 13: 12.x no longer compiles against
      #     electron 45's V8 (GetPrototypeV2). 13.x is node-addon-api and
      #     loads its bundled prebuilds, so it is no longer rebuilt (see
      #     scripts/native-modules.js). It needs Node >= 22; both the electron
      #     runtime and the host toolchain (Node 24) satisfy it.
      #   - babel targets in webpack.config.js / webpack.main.config.js.
      #
      # Verification recipe for the next major (in a separate worktree: a
      # rebuild overwrites node_modules/<pkg>/build/Release/*.node in place):
      #   1. bump electron; npm install
      #   2. node -e "console.log(require(require.resolve('node-abi',
      #        {paths:['node_modules/@electron/rebuild']})).getAbi('<ver>','electron'))"
      #      "Could not detect abi" => `npm update node-abi`
      #   3. npm run rebuild && npm run verify:native-modules
      #   4. npm run dev                            # smoke: app boots
      #   5. npm run local:gate                     # full ci + native verify
      - dependency-name: 'electron'
        update-types:
          - 'version-update:semver-major'

      # ─── embedding-atlas: stay on 0.22.x ─────────────────────────────────
      # 0.x minors are breaking. 0.24.0 added an embedding worker that the
      # barrel instantiates via `new Worker(new URL('./embedding.worker.js',
      # import.meta.url))`; webpack bundles that worker and fails on its
      # dynamic `import('https://cdn.jsdelivr.net/npm/@huggingface/...')`.
      # Even if resolvable, a privacy-first app with `script-src 'self'` must
      # not ship code that fetches models from a CDN. package.json pins
      # `~0.22.0`; the 43-update Dependabot group (#412) bumped it to 0.24 and
      # broke `npm run build` because Actions were off.
      #
      # Unblock signal: an embedding-atlas release whose dist contains no
      # remote-URL imports (grep dist/ for `cdn.jsdelivr`), or a subpath
      # export that exposes EmbeddingView without the worker chunk. Verify
      # with `npm run build` and the Atlas tab before lifting.
      - dependency-name: 'embedding-atlas'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'

      # ─── typescript: stay on 6.x ─────────────────────────────────────────
      # The JSDoc checkjs lane (`npm run typecheck:js`, 432 opted-in .js files
      # under `// @ts-check`) relies on TypeScript inferring CommonJS
      # `module.exports = X; module.exports.y = ...` shapes. TypeScript 7.0.2
      # (#382, merged with Actions off) reports 351 errors on the same sources
      # that 6.0.3 checks clean (TS2309 "export assignment cannot be used in a
      # module with other exported elements", lost `getInstance`/typedef
      # members, `typeof` on `require()` results). `npm run ci` fails at
      # typecheck:js.
      #
      # Unblock signal: either the checkjs lane migrates every
      # `module.exports = ...; module.exports.x = ...` module to a single
      # object export (or ESM), or a TypeScript 7.x release restores the
      # CommonJS inference. Verify with `npm run typecheck:js` before lifting.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

      # ─── Node >= 22 majors: holds lifted 2026-11-04 ──────────────────────
      # better-sqlite3, @testing-library/jest-dom and cssnano majors were held
      # while the host toolchain was Node 20.19 (jest-dom 7 broke 43 suites;
      # cssnano 8 calls Set.prototype.difference). The toolchain is Node 24
      # now, so their majors arrive as ordinary Dependabot PRs again; each
      # still has to pass `npm run ci` on its own.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - ci
      - automerge
