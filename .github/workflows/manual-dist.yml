# Defaults: macOS only (cannot build on Windows). Enable Windows only if you need a cloud Windows dist;
# otherwise use npm run dist:win locally.
name: Manual Dist Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows distribution (optional; prefer npm run dist:win locally)
        required: true
        default: false
        type: boolean
      build_macos:
        description: Build macOS Apple Silicon (arm64; requires macOS runner)
        required: true
        default: true
        type: boolean
      build_macos_intel:
        description: Build macOS Intel (x64) — second macOS job; runs on Intel runner (macos-15-intel)
        required: true
        default: false
        type: boolean
      publish_release:
        description: Create draft GitHub release with uploaded artifacts
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release tag to create/update when publish_release=true (example: v2.0.1)'
        required: false
        default: ''
        type: string
      release_name:
        description: Optional release title (defaults to tag)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: manual-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify Windows build assets
        run: node scripts/verify-build-assets.js --platform=win

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Generate installer assets
        shell: pwsh
        run: npm run generate:branding-if-source

      - name: Rebuild native modules for Electron runtime
        run: npx --no electron-builder install-app-deps

      - name: Verify native module loading
        run: npm run verify:native-modules

      - name: Clean release output directory
        shell: pwsh
        run: |
          $target = Join-Path $PWD "release/build"
          if (-not (Test-Path $target)) { return }

          for ($i = 0; $i -lt 6; $i++) {
            try {
              Remove-Item -Path $target -Recurse -Force -ErrorAction Stop
              break
            }
            catch {
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds 3
            }
          }

      - name: Build Windows distribution
        run: npm run dist:win

      - name: Verify packaged Windows artifacts
        run: node scripts/verify-packaged-artifacts.js --platform=win

      - name: Verify Windows updater metadata
        run: node scripts/verify-updater-metadata.js --platform=win --build-root=release/build

      - name: Generate SHA256 checksums
        run: |
          $files = Get-ChildItem release/build -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^StratoSortStack-.*\.(exe|blockmap)$|^latest\.yml$' }
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows build artifacts found to checksum."
          }

          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash *$($_.Name)"
          }
          $hashes | Out-File release/build/checksums-windows.sha256 -Encoding ASCII

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stratosort-windows-dist-${{ github.run_number }}
          path: |
            release/build/StratoSortStack-Setup-*.exe
            release/build/StratoSortStack-*-win-*.exe
            release/build/*.blockmap
            release/build/latest.yml
            release/build/checksums-windows.sha256
          if-no-files-found: error

  dist-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify macOS build assets
        run: node scripts/verify-build-assets.js --platform=mac

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Generate installer assets
        run: npm run generate:branding-if-source

      - name: Rebuild native modules for Electron runtime (arm64)
        run: npx --no electron-builder install-app-deps --arch=arm64

      - name: Verify native module loading
        run: npm run verify:native-modules

      - name: Clean release output directory
        run: |
          rm -rf release/build

      - name: Build macOS distribution (arm64)
        run: npm run dist:mac:arm64

      - name: Verify packaged macOS artifacts (arm64)
        run: node scripts/verify-packaged-artifacts.js --platform=mac --arch=arm64

      - name: Verify macOS updater metadata
        run: node scripts/verify-updater-metadata.js --platform=mac --build-root=release/build

      - name: Generate SHA256 checksums
        run: |
          cd release/build
          rm -f checksums-macos.sha256

          for f in StratoSortStack-*.dmg StratoSortStack-*.zip; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" >> checksums-macos.sha256
            fi
          done

          if [ ! -s checksums-macos.sha256 ]; then
            echo "No macOS build artifacts found to checksum."
            exit 1
          fi

      - name: Stage arm64 artifacts (stable updater metadata names)
        run: |
          set -euo pipefail
          mkdir -p release/stage-macos-arm64
          shopt -s nullglob
          for path in release/build/StratoSortStack-*-mac-arm64.dmg release/build/StratoSortStack-*-mac-arm64.zip; do
            if [ -f "$path" ]; then
              cp "$path" release/stage-macos-arm64/
            fi
          done
          for f in release/build/latest*.yml; do
            if [ -f "$f" ]; then
              cp "$f" release/stage-macos-arm64/latest-mac-arm64.yml
            fi
          done
          cp release/build/checksums-macos.sha256 release/stage-macos-arm64/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stratosort-macos-dist-${{ github.run_number }}
          path: |
            release/stage-macos-arm64/*
          if-no-files-found: error

  dist-macos-intel:
    if: ${{ inputs.build_macos_intel }}
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify macOS build assets
        run: node scripts/verify-build-assets.js --platform=mac

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Generate installer assets
        run: npm run generate:branding-if-source

      - name: Rebuild native modules for Electron runtime (x64)
        run: npx --no electron-builder install-app-deps --arch=x64

      - name: Verify native module loading
        run: npm run verify:native-modules

      - name: Clean release output directory
        run: |
          rm -rf release/build

      - name: Build macOS distribution (Intel x64)
        run: npm run dist:mac:x64

      - name: Verify packaged macOS artifacts (x64)
        run: node scripts/verify-packaged-artifacts.js --platform=mac --arch=x64

      - name: Verify macOS updater metadata
        run: node scripts/verify-updater-metadata.js --platform=mac --build-root=release/build

      - name: Generate SHA256 checksums
        run: |
          cd release/build
          rm -f checksums-macos-intel.sha256

          for f in StratoSortStack-*.dmg StratoSortStack-*.zip; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" >> checksums-macos-intel.sha256
            fi
          done

          if [ ! -s checksums-macos-intel.sha256 ]; then
            echo "No macOS Intel build artifacts found to checksum."
            exit 1
          fi

      - name: Stage Intel artifacts
        run: |
          set -euo pipefail
          mkdir -p release/stage-macos-x64
          shopt -s nullglob
          for path in release/build/StratoSortStack-*-mac-x64.dmg release/build/StratoSortStack-*-mac-x64.zip; do
            if [ -f "$path" ]; then
              cp "$path" release/stage-macos-x64/
            fi
          done
          for f in release/build/latest*.yml; do
            if [ -f "$f" ]; then
              cp "$f" release/stage-macos-x64/latest-mac-x64.yml
            fi
          done
          cp release/build/checksums-macos-intel.sha256 release/stage-macos-x64/

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stratosort-macos-intel-dist-${{ github.run_number }}
          path: |
            release/stage-macos-x64/*
          if-no-files-found: error

  publish-release:
    needs:
      - dist-windows
      - dist-macos
      - dist-macos-intel
    # When a needed job is skipped (e.g. Windows disabled), the job must still run; use always() per GitHub Actions rules.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.publish_release &&
        (!inputs.build_windows || needs.dist-windows.result == 'success') &&
        (!inputs.build_macos || needs.dist-macos.result == 'success') &&
        (!inputs.build_macos_intel || needs.dist-macos-intel.result == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release=true"
            exit 1
          fi

      # Same guard as release.yml: a draft release whose tag doesn't match the
      # built package version would ship updater metadata (latest*.yml) with a
      # version the tag does not correspond to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node -e "const tag=process.env.RELEASE_TAG; const pkg=require('./package.json'); const expected=String(tag).replace(/^v/, ''); if (pkg.version !== expected) { throw new Error('package.json version ' + pkg.version + ' does not match release tag ' + tag); }"

      - name: Download Windows artifacts
        if: ${{ inputs.build_windows }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stratosort-windows-dist-${{ github.run_number }}
          path: release-upload/windows

      - name: Download macOS artifacts
        if: ${{ inputs.build_macos }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stratosort-macos-dist-${{ github.run_number }}
          path: release-upload/macos

      - name: Download macOS Intel artifacts
        if: ${{ inputs.build_macos_intel }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stratosort-macos-intel-dist-${{ github.run_number }}
          path: release-upload/macos-intel

      - name: Prepare merged release files
        run: |
          mkdir -p release-upload/final

          if [ "${{ inputs.build_windows }}" = "true" ] && [ -d release-upload/windows ]; then
            for f in release-upload/windows/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              cp "$f" "release-upload/final/$base"
            done
          fi

          if [ "${{ inputs.build_macos }}" = "true" ] && [ -d release-upload/macos ]; then
            for f in release-upload/macos/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              target="release-upload/final/$base"
              if [ -e "$target" ]; then
                if [[ "$base" == latest*.yml ]]; then
                  echo "Conflicting updater metadata filename detected: $base"
                  exit 1
                fi
                target="release-upload/final/macos-$base"
              fi
              cp "$f" "$target"
            done
          fi

          if [ "${{ inputs.build_macos_intel }}" = "true" ] && [ -d release-upload/macos-intel ]; then
            for f in release-upload/macos-intel/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              target="release-upload/final/$base"
              if [ -e "$target" ]; then
                if [[ "$base" == latest*.yml ]]; then
                  echo "Conflicting updater metadata filename detected: $base"
                  exit 1
                fi
                target="release-upload/final/macos-intel-$base"
              fi
              cp "$f" "$target"
            done
          fi

          count=$(find release-upload/final -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No files prepared for release upload."
            exit 1
          fi

      - name: Merge macOS updater metadata
        # electron-updater requests exactly latest-mac.yml on darwin; the mac
        # jobs stage arch-suffixed names only to avoid collisions. Union them
        # into the canonical file and drop the staging names (x64 first so the
        # legacy path/sha512 fields mirror release.yml's convention).
        run: |
          set -euo pipefail
          cd release-upload/final
          staged=()
          for f in latest-mac-x64.yml latest-mac-arm64.yml; do
            [ -f "$f" ] && staged+=("$f")
          done
          if [ ${#staged[@]} -eq 0 ]; then
            echo "No macOS updater metadata staged; skipping merge."
            exit 0
          fi
          node ../../scripts/merge-updater-metadata.js --output=latest-mac.yml "${staged[@]}"
          rm -f "${staged[@]}"
          node ../../scripts/verify-updater-metadata.js --platform=mac --build-root=release-upload/final

      - name: Resolve release metadata
        id: release_meta
        run: |
          tag="${{ inputs.release_tag }}"
          name="${{ inputs.release_name }}"
          if [ -z "$name" ]; then
            name="$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-upload/final/*
