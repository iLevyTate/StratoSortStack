name: Dependabot Auto-merge
# `pull_request`, not `pull_request_target`: this is GitHub's documented
# Dependabot auto-merge pattern, and GitHub is making pull_request_target
# blocked by default on public repos (a scheduled brownout already stopped this
# workflow from starting on 2026-11-09). A Dependabot-triggered run gets a
# read-only GITHUB_TOKEN that the `permissions` block below raises, and only
# Dependabot secrets; the job needs neither a secret nor the base-branch
# context that pull_request_target existed for.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  automerge:
    # Key off the PR author, not the workflow actor: a maintainer re-running
    # this workflow (or a synchronize event they trigger) would otherwise
    # change github.actor and skip/mis-fire the gate.
    #
    # Opt-in via the repo Variable DEPENDABOT_AUTOMERGE=true. Off by default:
    # when main has no rule requiring the CI checks, GitHub auto-merge has
    # nothing to wait for and merges the moment it is enabled (PRs #5, #6
    # and #8 merged ~12 s after opening, before CI started). Turn it on only
    # after main requires the CI checks to pass. If the variable ever does not
    # reach a Dependabot-triggered run, the condition is false and the job
    # skips, so the failure mode is "auto-merge off", never "merge unchecked".
    #
    # The repository check keeps forks of this repo from running the job.
    if: >-
      vars.DEPENDABOT_AUTOMERGE == 'true' &&
      github.repository == 'iLevyTate/StratoSortStack' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-approve - skip this step if you don't have branch protection requiring reviews
      # Uncomment the following lines and add DEPENDABOT_PAT secret if needed
      # - name: Auto approve PR
      #   uses: hmarr/auto-approve-action@v3
      #   with:
      #     github-token: ${{ secrets.DEPENDABOT_PAT }}

      # Enable GitHub auto-merge only for patch/minor (major requires human review).
      # Auto-merge completes only after required checks pass. There is
      # deliberately NO immediate-merge step here: this workflow fires on
      # `opened` (before any CI run starts), so a direct pulls.merge call
      # would land unverified dependency bumps on main whenever branch
      # protection is not configured to require checks.
      - name: Enable auto-merge for Dependabot PRs
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          merge-method: squash
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
