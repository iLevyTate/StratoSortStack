# docs/_config.yml
title: 'StratoSort Stack'
description: 'Intelligent File Organization with Privacy-First Local AI'
url: 'https://iLevyTate.github.io'
baseurl: '/StratoSortStack'
repository: 'iLevyTate/StratoSortStack'

# Use a pinned Minimal Mistakes release for deterministic GitHub Pages builds.
# GitHub Pages runs an older Sass engine that can break against upstream HEAD changes.
remote_theme: 'mmistakes/minimal-mistakes@4.24.0'

# Required plugin for Minimal Mistakes
plugins:
  - jekyll-include-cache

# Minimal Mistakes Specific Configuration
minimal_mistakes_skin: 'dark' # We use dark mode to match the app's aesthetic
search: true # built-in Lunr index; runs in the browser, no external service

# Top-bar and sidebar navigation live in _data/navigation.yml (`main` and `docs`).

# The marketing site is stratosort.com (separate repo); this site is the documentation.
atom_feed:
  hide: true
footer:
  links:
    - label: 'stratosort.com'
      icon: 'fas fa-fw fa-globe'
      url: 'https://stratosort.com/'
    - label: 'GitHub'
      icon: 'fab fa-fw fa-github'
      url: 'https://github.com/iLevyTate/StratoSortStack'
    - label: 'License (PolyForm Noncommercial 1.0.0)'
      icon: 'fas fa-fw fa-file-contract'
      url: 'https://github.com/iLevyTate/StratoSortStack/blob/main/LICENSE'
    - label: 'Privacy'
      icon: 'fas fa-fw fa-user-shield'
      url: 'https://stratosort.com/privacy.html'

# Keep these in git, but do not emit them as GitHub Pages. Baseline snapshots,
# demo fixtures, and CI inventories are not the public site. Live guides, e2e
# stills, tour stills, and how-to-use.mp4 still publish.
exclude:
  - baselines
  - walkthrough-assets/demo-files
  - commercial-use-inventory.json
  - commercial-model-licenses.json
  - commercial-compliance-waivers.json

# Defaults for all markdown files in this repo to automatically get the single layout
# and the sidebar navigation
defaults:
  - scope:
      path: '' # an empty string here means all files in the project
      type: 'pages'
    values:
      layout: 'single'
      author_profile: false
      toc: true
      toc_sticky: true
      sidebar:
        nav: 'docs'
